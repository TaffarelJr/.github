# yaml-language-server: $schema=https://raw.githubusercontent.com/GitTools/GitVersion/main/schemas/6.0/GitVersion.configuration.json

#───────────────────────────────────────────────────────────────────────────────
# Versioning
#
# The version is derived from git history, not from a file anyone edits, so
# nothing can be forgotten or disagree. GitVersion is used rather than a
# language-specific tool because it reads commits and tags only: the same
# config works for .NET, Node, Python, or anything else.
#
# Every build gets its own number. That is what lets a release name a specific
# build: if two commits shared a version, there would be no telling which one
# an artifact came from, and releasing anything but the newest commit would be
# unsafe.
#───────────────────────────────────────────────────────────────────────────────

# A single main branch, short-lived branches merged into it, and tags on main
# marking releases. No GitFlow: no develop, release, or hotfix branches.
workflow: GitHubFlow/v1

# The default for any branch that does not override it below.
mode: ContinuousDeployment

#───────────────────────────────────────────────────────────────────────────────
# Version strategies
#
# The built-in set, plus Mainline. Mainline is what gives every commit on main
# its own major.minor.patch, rather than one number shared until the next tag.
# It used to be 'mode: Mainline'; in v6 it is a strategy instead. Listing any
# strategies REPLACES the defaults, so the built-in ones have to be spelled
# out alongside it.
#
# Numbers are skipped rather than consecutive, and that is fine. Only the tip
# of a merge is ever built, so a three-commit pull request advances the patch
# number by three and just the last of them becomes an artifact. Unique and
# increasing is the point; gapless is not.
#───────────────────────────────────────────────────────────────────────────────

strategies:
  - Fallback
  - ConfiguredNextVersion
  - MergeMessage
  - TaggedCommit
  - TrackReleaseBranches
  - VersionInBranchName
  - Mainline

#───────────────────────────────────────────────────────────────────────────────
# Starting point, and forcing a version
#
# next-version is a FLOOR. Whichever is higher wins - it, or what the commits
# since the last tag have earned - and it goes inert as soon as a tag reaches
# it, so there is never anything to remember to undo.
#
# That makes it right for exactly two jobs:
#
#   1. Seeding a repo that has no tags yet, which is what this value is.
#   2. Declaring that the next release is a specific number. Raise it, cut the
#      release, and it is inert again.
#
# It is the wrong tool for a routine bump - 'feat:' and 'feat!:' already do
# that, and being a floor it would simply be overtaken.
#───────────────────────────────────────────────────────────────────────────────

next-version: 0.0.1

#───────────────────────────────────────────────────────────────────────────────
# Conventional Commits
#
# The commit type decides the bump, so the version is a consequence of what
# was written in the message. GitVersion applies the HIGHEST bump found since
# the last tag - not one per commit - which is what SemVer asks for.
#
# Each pattern also keeps GitVersion's own '+semver:' directive alive.
# Overriding these regexes replaces the built-in patterns rather than adding
# to them, so leaving it out would silently remove the escape hatch for a
# commit whose type does not imply the bump it needs.
#
# Keep these in step with docs/ConventionalCommits.md.
#───────────────────────────────────────────────────────────────────────────────

commit-message-incrementing: Enabled

# A '!' before the colon, or a 'BREAKING CHANGE' footer.
major-version-bump-message: '^\s*\w+(\([^)]*\))?!\s*:|^BREAKING[ -]CHANGE|\nBREAKING[ -]CHANGE|\+semver:\s?(breaking|major)'

# Only a new feature earns a minor bump.
minor-version-bump-message: '^\s*feat(\([^)]*\))?\s*:|\+semver:\s?(feature|minor)'

# Everything else is a patch, including the custom 'infra' type.
patch-version-bump-message: '^\s*(build|chore|ci|docs|fix|infra|perf|refactor|revert|style|test)(\([^)]*\))?\s*:|\+semver:\s?(fix|patch)'

# '+semver: none' stops a commit from escalating the bump - a 'feat:' marked
# this way will not force a minor. It does not hold the version still: the
# commit still earns the default patch increment that anything unrecognized
# gets, because every build needs a number of its own.
no-bump-message: '\+semver:\s?(none|skip)'

#───────────────────────────────────────────────────────────────────────────────
# Branch overrides
#
# Two separate concerns, both of which have to be stated per branch type.
#
# mode: main takes stable major.minor.patch numbers, because a release ships
# the artifacts CI already built - a prerelease suffix there would make every
# release a prerelease. Everywhere else takes ContinuousDelivery, which adds a
# fourth number so each commit on a branch builds a distinct version.
#
# track-merge-message: GitVersion reads a merge commit's message to pick up
# the version of a release branch being merged in. There are no release
# branches here, so it is only a way to be surprised: merging a branch named
# 'release/9.9.9' would make 9.9.9 the version. The same key at the top level
# reports as set, but has no effect.
#
# Neither of them stops a merge message being read for the bump patterns
# above. That is harmless, because the highest bump wins rather than
# accumulating, so a merge cannot claim more than its own commits did.
#───────────────────────────────────────────────────────────────────────────────

branches:
  main:
    mode: ContinuousDeployment
    track-merge-message: false
  feature:
    mode: ContinuousDelivery
    track-merge-message: false
  pull-request:
    mode: ContinuousDelivery
    track-merge-message: false
  unknown:
    mode: ContinuousDelivery
    track-merge-message: false
