# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Checks codecov.yml against Codecov's own validator - it silently falls back
# to defaults on a parse failure, so a typo would otherwise just quietly stop
# enforcing thresholds with no error anywhere.
#
# A shell: triggers can't be inherited, so this file is local even though the
# check lives in the shared action and stays identical at every layer.

name: Validate Codecov

on:
  pull_request:
    paths:
      - .github/codecov.yml

  workflow_dispatch:

jobs:
  validate:
    name: Validate codecov.yml
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to check out the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # Only the file itself is needed

      - name: Validate the Codecov configuration
        uses: TaffarelJr/.actions/validate-codecov@v1
