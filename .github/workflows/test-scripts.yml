# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Runs the scaffolding scripts' own tests, on both platforms they run on -
# line endings normalise differently on each. The runner discovers every
# *.Tests.ps1 itself, so this file lists nothing and stays identical at every
# template layer. A leaf has no scripts/, so this is a clean no-op there.

name: Test Scripts

on:
  pull_request:
    paths:
      - scripts/**
      - .github/workflows/test-scripts.yml

  # Can be triggered manually
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: test-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    permissions:
      contents: read # Needed to check out the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # The scripts under test need no history

      - name: Run the script tests
        shell: pwsh
        run: |
          $runner = './scripts/tests/Run-Tests.ps1'
          if (-not (Test-Path $runner)) {
            Write-Host 'No scripts/ folder in this repo - nothing to test'
            exit 0
          }

          & $runner -ShowOutput
