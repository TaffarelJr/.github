# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Runs the scaffolding scripts' own tests, on both platforms they run on.
#
# The scripts are this repo's code: every Common-*.psm1 and New-Repo-*.psm1 is
# inherited verbatim by every template layer below, so a defect here reaches
# them all. The tests live beside the scripts in scripts/tests/, and the runner
# picks up every *.Tests.ps1 it finds there - a layer's tests for its own
# module included - so this file lists nothing and stays identical at every
# layer.
#
# Both runners matter: a checkout normalises line endings differently on each,
# and the scripts have to cope with either.
#
# A leaf repo has no scripts/ folder, so this never triggers there, and a
# manual run says so and passes.

name: Test Scripts

on:
  pull_request:
    paths:
      - scripts/**
      - .github/workflows/test-scripts.yml

  # Can be triggered manually
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: test-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    permissions:
      contents: read # Needed to check out the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # The scripts under test need no history

      - name: Run the script tests
        shell: pwsh
        run: |
          $runner = './scripts/tests/Run-Tests.ps1'
          if (-not (Test-Path $runner)) {
            Write-Host 'No scripts/ folder in this repo - nothing to test'
            exit 0
          }

          & $runner -ShowOutput
