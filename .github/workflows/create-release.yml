# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The entry point for cutting a release: Actions -> Create Release -> Run.
#
# There is exactly one way in, on purpose. Pushing a tag looks like it should
# work too, but the version is stamped into the binaries when CI builds them,
# so a tag could only ever name the version that was already built - and if it
# named a different one, the release would have to either lie or rebuild. To
# choose a version, raise next-version in GitVersion.yml and let CI build it.
#
# A release happens when a human decides one should, not on every merge to
# main. Merges are continuously verified by CI; that is a different question
# from "these changes are worth a version number".
#
# Nothing is rebuilt. This file only triggers; the shared release workflow
# takes the artifacts CI already produced for the same commit.

name: Create Release

on:
  workflow_dispatch:

# Two releases drafted at once would race over the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Draft Release
    permissions:
      contents: write # Needed by the reusable workflow
      actions: read # Needed by the reusable workflow
    uses: ./.github/workflows/release.yml
