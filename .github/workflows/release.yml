# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Drafts the GitHub Release. Every repo inherits this file unchanged.
#
# Nothing is built here. The binaries were built, versioned, and uploaded by
# the CI run for this exact commit; this workflow finds that run, takes its
# artifacts, and attaches them. So what gets released is bit-for-bit what was
# tested, and a release cannot differ from the build that verified it.
#
# The release is created as a DRAFT on purpose. No tag exists yet for the
# dispatch path, nothing is published, and nothing downstream fires until a
# human opens it, reads the notes, and presses Publish. Deleting a draft
# leaves no trace, so a release that turns out to be wrong costs nothing.

name: Release

on:
  workflow_call:
    inputs:
      build-workflow:
        description: Name of the workflow whose artifacts should be released.
        type: string
        required: false
        default: Continuous Integration
      artifact-name:
        description: Artifact holding the built output and version.txt.
        type: string
        required: false
        default: packages
    outputs:
      version:
        description: The version that was drafted.
        value: ${{ jobs.draft.outputs.version }}
      url:
        description: The draft release's URL.
        value: ${{ jobs.draft.outputs.url }}

jobs:
  draft:
    name: Draft Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create the release
      actions: read # Needed to read artifacts from the CI run

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      url: ${{ steps.create.outputs.url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The changelog needs all the history and tags

      #─────────────────────────────────────────────────────────────────────────
      # Find the build to release
      #─────────────────────────────────────────────────────────────────────────

      - name: Locate the CI run for this commit
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ inputs.build-workflow }}
        run: |
          # The newest successful run for this exact commit. Anything older is
          # a different tree; anything unsuccessful was never verified.
          run_id=$(gh run list \
            --workflow "$WORKFLOW" \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$run_id" ]; then
            echo "::warning::No successful '$WORKFLOW' run for $GITHUB_SHA."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing the output of run $run_id"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the built artifacts
        if: steps.locate.outputs.found == 'true'
        continue-on-error: true # An expired artifact must not kill the release
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: artifacts
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      #─────────────────────────────────────────────────────────────────────────
      # Decide the version
      #─────────────────────────────────────────────────────────────────────────

      - name: Install GitVersion
        if: steps.locate.outputs.found != 'true'
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"

      - name: Calculate a fallback version
        id: fallback
        if: steps.locate.outputs.found != 'true'
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          useConfigFile: true

      - name: Resolve the version
        id: resolve
        shell: bash
        env:
          FALLBACK: ${{ steps.fallback.outputs.semVer }}
        run: |
          # version.txt is written by the build, so the release reports the
          # version that is actually stamped into the binaries rather than
          # recalculating and risking a different answer.
          if [ -f artifacts/version.txt ]; then
            version=$(tr -d '[:space:]' < artifacts/version.txt)
            echo "Version from the build: $version"
            rm artifacts/version.txt
          else
            version="$FALLBACK"
            echo "::warning::No version.txt; falling back to GitVersion ($version)."
          fi

          if [ -z "$version" ]; then
            echo "::error::Could not determine a version to release."
            exit 1
          fi

          # Refuse to draft over a version that has already shipped. The tag
          # is created when a release is published, so an existing one means
          # this exact version is public - and replacing it would change what
          # a consumer already resolved.
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already tagged, so it has already" \
              "been released. Merge something, or raise next-version in" \
              "GitVersion.yml to choose the next number."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      #─────────────────────────────────────────────────────────────────────────
      # Write the notes
      #─────────────────────────────────────────────────────────────────────────

      - name: Generate the changelog
        shell: pwsh
        run: >
          ./scripts/New-Changelog.ps1
          -Version '${{ steps.resolve.outputs.version }}'
          -OutputPath 'Changelog.md'

      # ── Have a model write the opening paragraph ──────────────────────────
      #
      # Always attempted, never required. A missing token, an expired one, a
      # service outage or a network error all land in the same place: the
      # placeholder comment stays, the release still gets drafted, and you can
      # either write the paragraph yourself or delete the draft and re-run
      # once the service is back.

      - name: Build the summary prompt
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "Below is a generated changelog for version $VERSION."
            echo
            echo "Write 2-4 sentences for the top of the release notes,"
            echo "saying what changed and why a reader should care. Lead with"
            echo "the most significant change, and mention breaking changes"
            echo "first if there are any. Do not list every commit, do not"
            echo "use headings, and do not repeat the commit counts."
            echo "Plain prose, no preamble."
            echo
            echo "---"
            echo
            cat Changelog.md
          } > prompt.txt

      # Not pre-installed on GitHub-hosted runners, and the action shells out
      # to it, so without this the summary step fails every time.
      - name: Install the Copilot CLI
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Summarize the changelog
        id: summary
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: prompt.txt
          model: gpt-4.1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Rewrite the notes with the summary
        if: steps.summary.outcome == 'success' && steps.summary.outputs.response-file != ''
        shell: pwsh
        env:
          SUMMARY_FILE: ${{ steps.summary.outputs.response-file }}
        run: |
          ./scripts/New-Changelog.ps1 `
            -Version '${{ steps.resolve.outputs.version }}' `
            -OutputPath 'Changelog.md' `
            -SummaryPath $env:SUMMARY_FILE

      #─────────────────────────────────────────────────────────────────────────
      # Draft it
      #─────────────────────────────────────────────────────────────────────────

      - name: Create the draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.resolve.outputs.version }}
        run: |
          # A draft is not idempotent - re-running would add a second draft for
          # the same version - so replace any existing draft for this tag.
          existing=$(gh release list --limit 100 \
            --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$TAG\" and .isDraft) | .tagName")
          if [ -n "$existing" ]; then
            echo "Replacing the existing draft for $TAG"
            gh release delete "$TAG" --yes
          fi

          # --target pins the release to this exact commit, so the tag lands
          # here when it is published even if main has moved on since.
          url=$(gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file Changelog.md \
            --target "$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

          if [ -d artifacts ] && [ -n "$(ls -A artifacts 2>/dev/null)" ]; then
            gh release upload "$TAG" artifacts/* --clobber
            echo "Attached $(ls -1 artifacts | wc -l) file(s)"
          else
            echo "::notice::No artifacts to attach."
          fi

          {
            echo "### Draft release [$TAG]($url)"
            echo
            echo "Review the notes, then press **Publish** to tag and ship."
          } >> "$GITHUB_STEP_SUMMARY"
